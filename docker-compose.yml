services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simpeg-daerah-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://simpeg.nusantarajaya.go.id
      - PORT=3000
    env_file:
      - .env.production
